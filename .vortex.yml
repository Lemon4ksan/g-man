# .vortex.yml — Vortex API Guardian Workspace Configuration
# Documentation: https://github.com/lemon4ksan/aoni

version: 1

defaults:
  casing: snake_case
  engine: fast

contracts:
  - name: WebAPI
    package: webapi
    dir: pkg/steam/webapi
    upstream:
      generate: go run ./cmd/generator/webapi -run-vortex=false
      refresh: go run ./cmd/generator/webapi -fetch -run-vortex=false

  - name: Inventory
    package: inventory
    dir: pkg/steam/community/inventory

  - name: Market
    package: market
    dir: pkg/steam/community/market

  - name: Profile
    package: profile
    dir: pkg/steam/community/profile

  - name: Chat
    package: chat
    dir: pkg/steam/social/chat

  - name: Friends
    package: friends
    dir: pkg/steam/social/friends

  - name: Status
    package: status
    dir: pkg/steam/social/status

  - name: Account
    package: account
    dir: pkg/steam/sys/account

  - name: Apps
    package: apps
    dir: pkg/steam/sys/apps

  - name: Directory
    package: directory
    dir: pkg/steam/sys/directory

  - name: GC
    package: gc
    dir: pkg/steam/sys/gc

  - name: Notifications
    package: notifications
    dir: pkg/steam/sys/notifications

  - name: CommunityTrade
    package: web
    dir: pkg/trading/web
